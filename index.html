<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한화손보 캐롯 FAQ 편집툴</title>
<style>
:root {
  --ink: #3A2F2C; --ink2: #60514D; --ink3: #948179;
  --line: #E1D4C9; --bg: #F7F1E9; --panel: #fff;
  --or: #F37323; --ord: #D85F18; --orl: #FBB584; --orb: #FFF1E5;
  --dan: #C0392B; --suc: #2E8B57;
  --sans: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-wrap {
  width: 100%;
  max-width: 400px;
}

.logo-area {
  text-align: center;
  margin-bottom: 32px;
}
.logo-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 6px;
}
.logo-sub {
  font-size: 14px;
  color: var(--ink3);
}

.card {
  background: var(--panel);
  border-radius: 12px;
  box-shadow: 0 4px 24px rgba(58,47,44,.10);
  padding: 32px;
}
.card-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 22px;
}

.form-group {
  margin-bottom: 16px;
}
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink2);
  margin-bottom: 6px;
}
.form-group input {
  width: 100%;
  height: 42px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 7px;
  font-size: 14px;
  font-family: var(--sans);
  outline: none;
  transition: all .12s;
  background: var(--bg);
  color: var(--ink);
}
.form-group input:focus {
  border-color: var(--or);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(243,115,35,.12);
}

.btn-login {
  width: 100%;
  height: 44px;
  background: var(--or);
  color: #fff;
  border: none;
  border-radius: 7px;
  font-size: 15px;
  font-weight: 600;
  font-family: var(--sans);
  cursor: pointer;
  transition: background .12s;
  margin-top: 6px;
}
.btn-login:hover { background: var(--ord); }
.btn-login:disabled { opacity: .6; cursor: not-allowed; }

.error-msg {
  display: none;
  background: #FEF0EE;
  border: 1px solid #F5C6C0;
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 13px;
  color: var(--dan);
  margin-bottom: 14px;
}
.error-msg.show { display: block; }

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 22px 0;
  color: var(--ink3);
  font-size: 12px;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--line);
}

.pw-reset-link {
  display: block;
  text-align: center;
  font-size: 13px;
  color: var(--ink3);
  margin-top: 16px;
  cursor: pointer;
  text-decoration: underline;
}
.pw-reset-link:hover { color: var(--ink2); }

/* 비밀번호 재설정 폼 */
.reset-form { display: none; }
.reset-form.show { display: block; }
.main-form.hide { display: none; }

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  color: var(--ink3);
  cursor: pointer;
  margin-bottom: 18px;
}
.back-link:hover { color: var(--ink2); }

.success-msg {
  display: none;
  background: #EFF7EE;
  border: 1px solid #B8DDB5;
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 13px;
  color: var(--suc);
  margin-bottom: 14px;
}
.success-msg.show { display: block; }

.loading {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .6s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.role-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
}
.role-badge.admin { background: var(--orb); color: var(--ord); }
.role-badge.editor { background: #EFF7EE; color: var(--suc); }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="logo-area">
    <div class="logo-title">한화손보 캐롯</div>
    <div class="logo-sub">FAQ 편집툴</div>
  </div>

  <div class="card">
    <!-- 로그인 폼 -->
    <div class="main-form" id="main-form">
      <div class="card-title">로그인</div>
      <div class="error-msg" id="login-error"></div>
      <div class="success-msg" id="login-success"></div>

      <div class="form-group">
        <label>이메일</label>
        <input type="email" id="email" placeholder="example@hanwha.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호 입력" autocomplete="current-password">
      </div>

      <button class="btn-login" id="btn-login">로그인</button>
      <span class="pw-reset-link" id="pw-reset-link">비밀번호를 잊으셨나요?</span>
    </div>

    <!-- 비밀번호 재설정 폼 -->
    <div class="reset-form" id="reset-form">
      <span class="back-link" id="back-link">← 로그인으로 돌아가기</span>
      <div class="card-title">비밀번호 재설정</div>
      <div class="success-msg" id="reset-success"></div>
      <div class="error-msg" id="reset-error"></div>
      <div class="form-group">
        <label>이메일</label>
        <input type="email" id="reset-email" placeholder="가입한 이메일 주소">
      </div>
      <button class="btn-login" id="btn-reset">재설정 링크 보내기</button>
    </div>
  </div>
</div>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase.js"></script>
<script>
(async function() {
  // 이미 로그인된 경우 앱으로 이동
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    window.location.href = '/app.html';
    return;
  }

  // ── 로그인 ──
  const btnLogin = document.getElementById('btn-login');
  const emailEl = document.getElementById('email');
  const pwEl = document.getElementById('password');
  const loginError = document.getElementById('login-error');
  const loginSuccess = document.getElementById('login-success');

  function showError(el, msg) {
    el.textContent = msg;
    el.classList.add('show');
  }
  function hideError(el) { el.classList.remove('show'); }

  function setLoading(btn, loading) {
    if (loading) {
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span>처리 중...';
    } else {
      btn.disabled = false;
      btn.textContent = btn.id === 'btn-login' ? '로그인' : '재설정 링크 보내기';
    }
  }

  btnLogin.addEventListener('click', async function() {
    const email = emailEl.value.trim();
    const pw = pwEl.value;
    hideError(loginError);
    if (!email || !pw) { showError(loginError, '이메일과 비밀번호를 입력하세요'); return; }

    setLoading(btnLogin, true);
    const { error } = await sb.auth.signInWithPassword({ email, password: pw });
    setLoading(btnLogin, false);

    if (error) {
      const msg = error.message.includes('Invalid login') ? '이메일 또는 비밀번호가 올바르지 않습니다'
        : error.message.includes('Email not confirmed') ? '이메일 인증이 필요합니다. 메일함을 확인하세요'
        : error.message;
      showError(loginError, msg);
} else {
  window.location.href = '/app.html';
}
  });

  // Enter 키 로그인
  [emailEl, pwEl].forEach(function(el) {
    el.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') btnLogin.click();
    });
  });

  // ── 비밀번호 재설정 ──
  document.getElementById('pw-reset-link').addEventListener('click', function() {
    document.getElementById('main-form').classList.add('hide');
    document.getElementById('reset-form').classList.add('show');
  });
  document.getElementById('back-link').addEventListener('click', function() {
    document.getElementById('main-form').classList.remove('hide');
    document.getElementById('reset-form').classList.remove('show');
  });

  document.getElementById('btn-reset').addEventListener('click', async function() {
    const email = document.getElementById('reset-email').value.trim();
    const resetError = document.getElementById('reset-error');
    const resetSuccess = document.getElementById('reset-success');
    hideError(resetError);
    if (!email) { showError(resetError, '이메일을 입력하세요'); return; }

    setLoading(this, true);
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/app'
    });
    setLoading(this, false);

    if (error) { showError(resetError, error.message); }
    else {
      resetSuccess.textContent = '재설정 링크를 보냈습니다. 메일함을 확인하세요.';
      resetSuccess.classList.add('show');
    }
  });
})();
</script>
</body>
</html>
